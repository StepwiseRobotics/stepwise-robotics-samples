name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check for sensitive information
        run: python tools/check_sensitive.py
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test (GPU不要のテストのみ)
        run: pytest
